apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier
  labels:
    role: frontend
    env: dev
spec:
  replicas: 1
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector:
    matchLabels:
      role: frontend
  template:
    spec:
      containers:
      - name: frontend
        image: public.ecr.aws/u4a8c5k0/threetier-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
